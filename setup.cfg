[metadata]
name = nationality-crime-atlas
version = 0.1.0
description = Provenance-first parsers for Japanese population and crime statistics

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    openpyxl>=3.1,<4
    xlrd>=2,<3

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8,<9
    pytest-cov>=7,<8
    xlwt>=1.3,<2

[options.entry_points]
console_scripts =
    nca-acquire = nationality_crime_atlas.acquisition_cli:main
    nca-audit-small-numbers = nationality_crime_atlas.small_number_cli:main
    nca-build-all-resident-context = nationality_crime_atlas.all_resident_context_cli:main
    nca-build-clearance-share-trend = nationality_crime_atlas.clearance_share_trend_cli:main
    nca-build-clearance-population-trend = nationality_crime_atlas.clearance_population_trend_cli:main
    nca-build-compact-export = nationality_crime_atlas.compact_export_cli:main
    nca-build-indicators = nationality_crime_atlas.indicator_cli:main
    nca-build-nationality-comparison = nationality_crime_atlas.nationality_comparison_cli:main
    nca-build-offense-composition = nationality_crime_atlas.offense_composition_cli:main
    nca-ingest = nationality_crime_atlas.cli:main
    nca-map-dimensions = nationality_crime_atlas.dimension_cli:main
    nca-pipeline = nationality_crime_atlas.pipeline_cli:main
    nca-snapshot = nationality_crime_atlas.snapshot_cli:main
    nca-validate = nationality_crime_atlas.quality_cli:main
