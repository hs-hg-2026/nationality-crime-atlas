name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Verify checked-in publication data
        working-directory: web
        run: npm run verify:data

      - name: Verify pinned map generation
        working-directory: web
        run: npm run generate:map

      - name: Confirm generated map is deterministic
        run: git diff --exit-code -- web/lib/japan-map-paths.generated.ts

      - name: Run frontend tests and coverage gates
        working-directory: web
        run: npm run test:coverage

      - name: Run type checks
        working-directory: web
        run: npm run typecheck

      - name: Run lint checks
        working-directory: web
        run: npm run lint

      - name: Run formatting checks
        working-directory: web
        run: npm run format:check

      - name: Build static site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Prepare GitHub Pages artifact layout
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run prepare:pages

      - name: Verify final GitHub Pages artifact
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run verify:pages

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist/client
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
